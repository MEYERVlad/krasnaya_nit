<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Красная нить</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500&family=Cormorant+SC:wght@500;600&family=Marck+Script&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* layout: a single letterboxed 1000×640 painted stage; chapter bar above, inventory shelf below */
:root{
  --ink:#0b0908; --soot:#17120f; --paper:#e9dfc7; --paper-dim:#a99d86; --blood:#a3221b; --brass:#c09a52;
  --f-display:'Cormorant SC','Cormorant Garamond',Georgia,serif;
  --f-body:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --f-hand:'Marck Script','Segoe Script','Brush Script MT',cursive;
  --f-news:'Old Standard TT',Georgia,serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#app{--w:min(100%, calc((100vh - 176px) * 1.5625));height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding-inline:16px;padding-block:8px;box-sizing:border-box}
@supports (height:100dvh){#app{--w:min(100%, calc((100dvh - 176px) * 1.5625))}}
.bar{width:var(--w);display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:34px}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand b{font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:.16em;color:var(--paper);white-space:nowrap}
.brand span{font-style:italic;color:var(--paper-dim);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px}
.ib{width:34px;height:34px;display:grid;place-items:center;background:transparent;border:1px solid rgba(233,223,199,.18);border-radius:50%;color:var(--paper);cursor:pointer;padding:0}
.ib:hover{border-color:var(--blood);background:rgba(163,34,27,.14)}
.ib:focus-visible,.btn:focus-visible,.slot:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.ib svg{width:18px;height:18px}
.stage{width:var(--w);aspect-ratio:1000/640;max-width:100%;position:relative;overflow:hidden;background:#000;container-type:inline-size;box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 0 1px #2a211b}
#scene,#scene>svg{display:block;width:100%;height:100%}
.hs{fill:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
.arrow{cursor:pointer}.arrow path{stroke:#efe5cd;opacity:.6;transition:opacity .2s}.arrow:hover path{opacity:1}
#scene.memory>svg{filter:sepia(.42) saturate(.85) contrast(1.06);animation:memflick 5s infinite}
@keyframes memflick{0%,100%{opacity:1}47%{opacity:1}48%{opacity:.93}49%{opacity:1}72%{opacity:.97}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .16s infinite alternate ease-in-out}
@keyframes flick{from{transform:scale(1,1) skewX(-2deg)}to{transform:scale(.9,1.08) skewX(3deg)}}
.rain{animation:rain .55s linear infinite}.rain.b{animation-duration:.72s;opacity:.6}
@keyframes rain{from{transform:translate(8px,-90px)}to{transform:translate(-8px,90px)}}
.drop{animation:drop 1.4s cubic-bezier(.3,.6,.4,1) both}
@keyframes drop{0%{transform:translate(120px,-420px) rotate(40deg);opacity:0}30%{opacity:1}100%{transform:none}}
.spin{animation:shimmer 1.4s linear infinite}
.blink{animation:blink 3.2s steps(1) infinite}
@keyframes blink{0%,100%{opacity:1}61%{opacity:.35}63%{opacity:1}66%{opacity:.5}68%{opacity:1}}
@keyframes shimmer{0%,100%{opacity:.15}50%{opacity:.45}}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.grain{position:absolute;inset:-50%;pointer-events:none;opacity:.10;animation:grain .9s steps(5) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-7%,4%)}40%{transform:translate(5%,-6%)}60%{transform:translate(-3%,8%)}80%{transform:translate(8%,2%)}100%{transform:translate(0,0)}}
.vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 9cqw rgba(0,0,0,.8)}
.cap{position:absolute;left:0;right:0;bottom:0;padding:6cqw 7cqw 2.6cqw;text-align:center;font-style:italic;font-size:clamp(13px,2.35cqw,23px);line-height:1.35;color:#f3e9d2;text-shadow:0 1px 2px #000,0 0 14px #000;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.72));opacity:0;transition:opacity .45s;pointer-events:none;text-wrap:balance}
.cap.on{opacity:1}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .28s}
#fade.white{background:#f2e8d2;transition:opacity .7s}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.title{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6cqw;text-align:center;background:radial-gradient(ellipse at 50% 55%,rgba(14,8,6,.55),rgba(4,2,2,.95) 75%);transition:opacity .9s}
.title.gone{opacity:0;pointer-events:none}
.title h1{margin:0;font-family:var(--f-display);font-weight:500;font-size:9.5cqw;letter-spacing:.1em;line-height:1;color:#efe4ca;text-shadow:0 0 30px rgba(0,0,0,.9);text-wrap:balance}
.title .thread{width:56cqw;height:5cqw;overflow:visible}
.title .thread path{stroke:var(--blood);stroke-width:2.2;fill:none;stroke-dasharray:700;stroke-dashoffset:700;animation:draw 3s .4s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.title p{margin:0;font-style:italic;font-size:clamp(13px,2.3cqw,22px);color:var(--paper-dim);max-width:62cqw;line-height:1.4}
.title .ch{font-family:var(--f-display);letter-spacing:.3em;font-size:clamp(11px,1.6cqw,16px);color:var(--brass);font-style:normal}
.title .row{display:flex;gap:2cqw;margin-top:1cqw;flex-wrap:wrap;justify-content:center}
.btn{font-family:var(--f-display);font-size:clamp(14px,2cqw,19px);letter-spacing:.14em;color:var(--paper);background:rgba(10,6,5,.4);border:1px solid rgba(233,223,199,.32);padding:.55em 1.5em;cursor:pointer}
.btn:hover{border-color:var(--blood);color:#fff;background:rgba(163,34,27,.2)}
.btn.red{border-color:var(--blood)}
.invrow{width:var(--w);display:flex;flex-direction:column;gap:4px}
.shelf{display:flex;gap:8px;overflow-x:auto;padding:7px 8px;min-height:70px;box-sizing:border-box;background:linear-gradient(#2a1a11,#170e09);border-top:2px solid #4b3020;box-shadow:inset 0 8px 14px rgba(0,0,0,.55);scrollbar-width:thin}
.slot{flex:0 0 56px;height:56px;border-radius:3px;background:radial-gradient(circle at 50% 38%,#3b2a1e,#1a110b);border:1px solid #3e2c1f;cursor:pointer;display:grid;place-items:center;padding:0;transition:box-shadow .2s,border-color .2s}
.slot:hover{border-color:#7a5a3c}
.slot.sel{border-color:var(--blood);box-shadow:0 0 0 2px var(--blood),0 0 16px rgba(163,34,27,.55)}
.slot>svg{width:50px;height:50px;pointer-events:none}
.slot.new{animation:newi 1s ease}
@keyframes newi{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.12)}100%{transform:none}}
.empty{font-style:italic;color:#6d5f4f;font-size:15px;align-self:center;padding-left:6px}
.ilabel{font-style:italic;color:var(--paper-dim);font-size:15px;min-height:20px;text-align:center}
.ilabel b{font-weight:600;color:var(--paper);font-style:normal}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;background:rgba(6,4,3,.86);opacity:0;transition:opacity .3s;overflow:auto}
.ov.on{opacity:1}
.ov[hidden],[hidden]{display:none!important}
.ov .inner{max-width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px}
.ov .close{font-style:italic;color:var(--paper-dim);font-size:15px}
.card{background:#e9dfc6;color:#2a1d14;box-shadow:0 20px 60px rgba(0,0,0,.8);position:relative}
.card::before{content:"";position:absolute;inset:0;background-image:var(--paper-tex);opacity:.55;pointer-events:none}
.itemcard{width:min(440px,100%);padding:26px 28px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;transform:rotate(-1deg)}
.itemcard>svg{width:150px;height:150px}
.itemcard h3{margin:0;font-family:var(--f-display);font-size:24px;letter-spacing:.1em;font-weight:600}
.itemcard p{margin:0;font-size:19px;line-height:1.4;font-style:italic;max-width:34ch}
.news{width:min(640px,100%);padding:26px 30px 30px;font-family:var(--f-news);background:#ddd0b1;color:#211810;transform:rotate(-.8deg)}
.news .mast{text-align:center;font-weight:700;font-size:clamp(26px,6vw,40px);letter-spacing:.06em;border-bottom:3px double #211810;padding-bottom:4px}
.news .date{display:flex;justify-content:space-between;gap:10px;font-size:13px;border-bottom:1px solid #211810;padding:4px 0;font-style:italic;flex-wrap:wrap}
.news h2{font-size:clamp(22px,4.6vw,32px);text-align:center;margin:14px 0 4px;line-height:1.05;text-wrap:balance}
.news .sub{text-align:center;font-style:italic;font-size:15px;margin-bottom:12px}
.news .cols{columns:2 220px;column-gap:24px;column-rule:1px solid rgba(33,24,16,.4);font-size:15px;line-height:1.45;text-align:justify;hyphens:auto}
.news .cols p{margin:0 0 .6em}
.news .cols p:first-child::first-letter{font-size:3em;float:left;line-height:.8;padding:4px 6px 0 0;font-weight:700}
.hand{font-family:var(--f-hand);color:#23324f}
.note{width:min(420px,100%);padding:34px 34px 30px;transform:rotate(1.4deg);background:#efe6d3;font-size:clamp(22px,5vw,30px);line-height:1.35}
.page{width:min(420px,100%);padding:30px 30px 28px 54px;transform:rotate(-1.2deg);background:#ece4cf;font-size:clamp(21px,4.6vw,27px);line-height:1.5;background-image:linear-gradient(transparent 39px,rgba(80,110,160,.35) 40px);background-size:100% 40.5px;background-position:0 12px}
.page::after{content:"";position:absolute;left:38px;top:0;bottom:0;width:1px;background:rgba(170,40,40,.5)}
.invite{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.inv-card{width:min(330px,100%);padding:26px 24px;background:#efe5cd;color:#2a1d14;text-align:center;border:1px solid #b8924a;outline:6px double rgba(184,146,74,.6);outline-offset:-14px;box-sizing:border-box}
.inv-card .script{font-family:var(--f-hand);font-size:27px;color:#3a2410;line-height:1.2}
.inv-card p{margin:.5em 0;font-size:17px;line-height:1.35;font-style:italic}
.inv-card .sm{font-family:var(--f-display);letter-spacing:.14em;font-size:13px;font-style:normal;color:#6a5030}
.inv-card ul{list-style:none;padding:0;margin:.6em 0;font-size:17px;line-height:1.55}
.photo-insp{background:#e6dbc1;padding:14px 14px 46px;box-shadow:0 20px 60px rgba(0,0,0,.8);transform:rotate(-1.5deg);position:relative;cursor:zoom-in;width:min(620px,100%);box-sizing:border-box}
.photo-insp>svg{display:block;width:100%;height:auto;filter:sepia(.9) contrast(.95) brightness(.88)}
.photo-insp .lbl{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-family:var(--f-hand);font-size:22px;color:#3b2b1c}
.photo-insp:hover{box-shadow:0 20px 60px rgba(0,0,0,.8),0 0 0 2px var(--blood)}
.ending{width:min(600px,100%);text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.ending .ch{font-family:var(--f-display);letter-spacing:.3em;color:var(--brass);font-size:14px}
.ending h2{margin:0;font-family:var(--f-display);font-weight:500;font-size:clamp(30px,6vw,48px);letter-spacing:.08em}
.ending p{margin:0;font-size:clamp(17px,2.4vw,21px);line-height:1.5;font-style:italic;color:#d9ceb6;max-width:46ch}
.ending .q{font-family:var(--f-hand);font-style:normal;color:#e2b0a6;font-size:clamp(22px,3.4vw,28px)}
.menu{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.menu h2{margin:0 0 6px;font-family:var(--f-display);font-weight:500;letter-spacing:.12em;font-size:30px}
#scene.red>svg{filter:grayscale(1) sepia(1) saturate(5) hue-rotate(-32deg) brightness(.7) contrast(1.15)}
.twin{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:center}
.twin>.card{transform:rotate(-1.5deg)}.twin>.card+.card{transform:rotate(1.8deg)}
.pcard{width:min(260px,100%);padding:12px 12px 6px;background:#e6dbc1}
.pcard>svg{display:block;width:100%;height:auto}
.back{width:min(300px,100%);min-height:300px;padding:28px 24px;box-sizing:border-box;background:#e3d7bc;display:flex;flex-direction:column;justify-content:space-between;gap:18px}
.back .hand{font-size:30px;line-height:1.2;color:#3a1a14;text-align:center}
.stamp{align-self:center;border:3px double #5b3a86;color:#5b3a86;border-radius:10px;padding:8px 14px;transform:rotate(-9deg);font-family:var(--f-display);letter-spacing:.12em;font-size:14px;text-align:center;line-height:1.35;opacity:.85}
.stamp b{display:block;font-size:20px;letter-spacing:.18em}
.letter{width:min(440px,100%);padding:26px 30px 30px;background:#efe7d3;transform:rotate(-1deg);display:flex;flex-direction:column;align-items:center;gap:8px}
.letter>svg{width:84px;height:84px}
.letter .sm{font-family:var(--f-display);letter-spacing:.16em;font-size:13px;color:#4a3a28;border-bottom:1px solid #8a7a60;padding-bottom:8px;text-align:center}
.letter .hand{font-size:clamp(21px,4.6vw,27px);line-height:1.4;align-self:stretch}
.negstrip{background:#2a1a0e;padding:22px 10px;display:flex;gap:10px;width:min(760px,100%);box-sizing:border-box;position:relative;transform:rotate(-1deg);box-shadow:0 20px 60px rgba(0,0,0,.8)}
.negstrip::before,.negstrip::after{content:"";position:absolute;left:0;right:0;height:12px;background:repeating-linear-gradient(90deg,transparent 0 9px,#d9c9a8 9px 17px);opacity:.75}
.negstrip::before{top:5px}.negstrip::after{bottom:5px}
.negstrip svg{flex:1;min-width:0;height:auto;filter:grayscale(1) invert(1) sepia(.7) hue-rotate(-15deg) saturate(1.6)}
@media (max-width:520px){.brand span{display:none}}
@media (prefers-reduced-motion:reduce){.blink,.rain,.flame,.grain,.spin,#scene.memory>svg,.title .thread path{animation:none}.title .thread path{stroke-dashoffset:0}}
</style>

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="gdefs"></defs></svg>

<div id="app">
  <div class="bar">
    <div class="brand"><b>КРАСНАЯ НИТЬ</b><span id="chName">Глава I. Ужин у Пикмана</span></div>
    <div class="tools">
      <button class="ib" id="bHint" title="Спросить ворона" aria-label="Подсказка"><svg viewBox="0 0 24 24"><path d="M3 15c2-5 6-8 10-7l3-2 4 1-3 2c1 3 0 6-3 8l2 4h-2l-2-3c-3 1-6 0-9-3z" fill="currentColor"/></svg></button>
      <button class="ib" id="bSound" title="Звук" aria-label="Звук"><svg viewBox="0 0 24 24" id="sndIco"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8c2 2 2 6 0 8M19 5c4 4 4 10 0 14" stroke="currentColor" stroke-width="1.6" fill="none"/></svg></button>
      <button class="ib" id="bMenu" title="Меню" aria-label="Меню"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14" stroke="currentColor" stroke-width="1.8"/></svg></button>
    </div>
  </div>
  <div class="stage" id="stage">
    <div id="scene"></div>
    <canvas id="fx"></canvas>
    <div class="grain" id="grain"></div>
    <div class="vig"></div>
    <div class="cap" id="cap"></div>
    <div id="flash"></div>
    <div id="fade"></div>
    <div class="title" id="title">
      <span class="ch" id="tCh">ГЛАВА I · УЖИН У ПИКМАНА</span>
      <h1>Красная нить</h1>
      <svg class="thread" viewBox="0 0 560 50" preserveAspectRatio="none"><path d="M4 30 C90 6 150 44 230 24 S380 8 440 30 S530 40 556 14"/></svg>
      <p id="tLead">Ноябрь 1953 года. Званый ужин у мистера Пикмана. Без двадцати десять моя мать упала лицом в скатерть, и больше не поднялась.</p>
      <div class="row"><button class="btn red" id="bStart">Начать</button><button class="btn" id="bCont" hidden>Продолжить</button></div>
    </div>
  </div>
  <div class="invrow">
    <div class="shelf" id="shelf"></div>
    <div class="ilabel" id="ilabel"></div>
  </div>
</div>
<div class="ov" id="ov" hidden><div class="inner" id="ovIn"></div></div>

<script>
(() => {
'use strict';
const OL = '#1a110d';
const LAST_KEY = 'krasnaya-nit-last';
const CHAPTERS = {
  1:{key:'krasnaya-nit-ch1-v1',name:'Глава I. Ужин у Пикмана',tag:'ГЛАВА I · УЖИН У ПИКМАНА',lead:'Ноябрь 1953 года. Званый ужин у мистера Пикмана. Без двадцати десять моя мать упала лицом в скатерть, и больше не поднялась.'},
  2:{key:'krasnaya-nit-ch2-v1',name:'Глава II. Тёмная комната',tag:'ГЛАВА II · ТЁМНАЯ КОМНАТА',lead:'1975 год. На обороте фотографии без лица — штамп фотолаборатории «Вечернего вестника». Газету закрыли, но мамин стол всё ещё стоит в редакции.'}
};
const $ = s => document.querySelector(s);

/* ---------- helpers ---------- */
function shade(hex, a){
  const n = parseInt(hex.slice(1),16); let r=n>>16, g=(n>>8)&255, b=n&255;
  const t = a<0?0:255, p=Math.abs(a);
  r=Math.round(r+(t-r)*p); g=Math.round(g+(t-g)*p); b=Math.round(b+(t-b)*p);
  return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);
}
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
let rnd = mulberry(1953);
const R = (a,b)=>a+rnd()*(b-a);
const hs = (id,x,y,w,h)=>`<rect class="hs" data-h="${id}" x="${x}" y="${y}" width="${w}" height="${h}"/>`;
const hse = (id,cx,cy,rx,ry)=>`<ellipse class="hs" data-h="${id}" cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"/>`;
const arrow = (x=500,y=608)=>`<g class="arrow" data-h="back"><rect class="hs" data-h="back" x="${x-50}" y="${y-26}" width="100" height="46"/><path d="M${x-16} ${y-6} L${x} ${y+7} L${x+16} ${y-6}" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" pointer-events="none"/></g>`;

/* ---------- textures (painted once on canvas) ---------- */
function tex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);return c.toDataURL('image/png');}
const T = {};

    s+=`<line x1="${x+44}" y1="${y+40}" x2="${x+66}" y2="${y+66}" stroke="#3a2416" stroke-width="8" stroke-linecap="round"/><circle cx="${x}" cy="${y}" r="58" fill="#e9e1cc" stroke="url(#gBrass)" stroke-width="7"/><g filter="url(#fSepia)"><ellipse cx="${x}" cy="${y}" rx="34" ry="44" fill="url(#gGold)" stroke="${OL}"/><ellipse cx="${x}" cy="${y}" rx="24" ry="33" fill="#141010"/>${ravenCrest(x,y,20,'#d8c79c')}</g><path d="M${x-40} ${y-26} Q${x-30} ${y-46} ${x-8} ${y-50}" stroke="#fff" stroke-width="3" opacity=".6" fill="none"/>`; }
  if(F.crest){ s+=`<g transform="translate(888 300) rotate(6)"><rect x="-54" y="-44" width="108" height="88" fill="#efe7d3" stroke="#8a7a60"/>${ravenCrest(0,-12,22)}<text x="0" y="32" text-anchor="middle" font-family="Cormorant SC, serif" font-size="10" letter-spacing="1" fill="#211810">ПРИЮТ СВ. АГНЕССЫ</text></g>`+thread(888,262,TLX[3]+18,TLY-64,20)+pin(888,262,'#c9a256'); }
  RB.forEach(([pid,x,y])=>{s+=hs('rb_'+pid,x-58,y-72,116,190);});
  s+=hs('rbMother',436,70,128,160)+hs('rbClip',412,280,176,66);
  TLX.forEach((x,i)=>{s+=hs('tl'+i,x-86,TLY-56,172,118);});
  s+=arrow(500,622);
  return s;
}

/* ---------- hints ---------- */
function hint(){
  if(S.ch===2) return hint2();
  const F=S.f, mem=MEMORY.has(S.scene);
  const allShot=['doctor','pickman','lady','butler'].every(p=>F.shot[p]);
  const allEv=F.sediment&&F.vialTaken&&F.noteTaken&&F.gloveTaken&&F.pageTaken;
  if(mem){
    if(!F.cameraTaken) return 'Кар! Кто-то снимал этот вечер. Его аппарат всё ещё стоит в углу.';
    if(!allShot) return 'Кар! Лица. Забери их лица с собой — всех, кто был за столом.';
    if(!F.sediment) return 'Кар! Мамин бокал. Взгляни на него поближе — через стекло.';
    if(!F.engr) return 'Кар! Доктор не выпускает из рук свои часы. Что написано на крышке?';
    if(!F.bagOpen) return 'Кар! Число с крышки часов откроет саквояж.';
    if(!F.noteTaken) return 'Кар! Леди никогда не расстаётся с веером. Что в нём спрятано?';
    if(!F.gloveTaken) return 'Кар! Что лежит на подносе у дворецкого?';
    if(!F.pageTaken) return 'Кар! Мамина сумочка. Она всюду носила блокнот.';
    return 'Кар! Ты собрала всё. Возвращайся к доске.';
  }
  if(!F.clockOpen) return 'Кар! Часы стоят не на том времени. Газета на доске помнит правильное.';
  if(!F.keyTaken) return 'Кар! В часах что-то блеснуло.';
  if(!F.trunkOpen) return 'Кар! Ключ подойдёт к маминому сундуку.';
  if(!F.recordTaken) return 'Кар! В сундуке лежит её музыка.';
  if(!F.recordPlaced) return 'Кар! Граммофон соскучился по вальсу.';
  if(!F.portraitOpen) return 'Кар! Дослушай. Смотри на неё.';
  if(!F.photoTaken) return 'Кар! За портретом — тайник.';
  if(!F.magTaken) return 'Кар! Возьми лупу со стола. Она пригодится там, куда ты идёшь.';
  if(!F.visited) return 'Кар! Рассмотри снимок. Вглядись в него как следует.';
  if(!(allShot&&allEv)) return 'Кар! Вернись в тот вечер. Ты ещё не всё увидела.';
  if(F.slots.filter(Boolean).length<4) return 'Кар! Приколи их лица к доске.';
  if(Object.keys(F.linked).length<4) return 'Кар! Каждой улике — своё лицо. Приглашение подскажет, кто есть кто.';
  if(!F.centerLinked) return 'Кар! Осадок из бокала — к маминой фотографии.';
  return 'Кар! Ты смотришь не туда, Ада.';
}

function hint2(){
  const F=S.f;
  if(F.ended) return 'Кар! Теперь ты смотришь туда, Ада.';
  if(S.scene==='office53'){
    if(!F.letterTaken) return 'Кар! На мамином столе лежит письмо. Кто-то назначил ей встречу.';
    if(!F.sawKey) return 'Кар! Фотограф стоит у лаборатории. Посмотри на дверь — куда он прячет ключ?';
    return 'Кар! Ты видела, где ключ. Возвращайся в семьдесят пятый.';
  }
  if(!F.groupTaken) return F.stamp?'Кар! Штамп: XI-14. Архив разложен по месяцам.':'Кар! Переверни фотографию без лица. На обороте есть штамп.';
  if(!F.visited) return 'Кар! Снимок из архива. Вглядись в него как следует.';
  if(!F.letterTaken||!F.sawKey) return 'Кар! Вернись в тот вечер. Ты ещё не всё увидела.';
  if(!F.keyTaken) return 'Кар! Над дверью лаборатории. Двадцать два года пыли.';
  if(!F.labOpen) return 'Кар! Ключ подойдёт к лаборатории.';
  if(!F.filmTaken) return 'Кар! Плёнку прячут там, где всегда темно. В увеличителе что-то гремит.';
  if(F.dev<3){
    if(!F.red) return 'Кар! Банку с плёнкой открывают только при красном свете.';
    if(!F.chart) return 'Кар! На стене висит порядок проявки.';
    return 'Кар! При красном свете все крышки одного цвета. Запомни их при белом. Или понюхай.';
  }
  if(!F.printed) return F.red?'Кар! Негатив — в увеличитель.':'Кар! Фотобумага боится белого света. Негатив — в увеличитель.';
  if(['pr1','pr2','pr3','pr4'].some(p=>!F.took[p])) return 'Кар! Сними отпечатки с верёвки.';
  if(!F.curtain) return 'Кар! За чёрной шторой кто-то вёл своё расследование.';
  if(F.tl.some(x=>!x)) return 'Кар! Смотри на часы в каждом кадре. Разложи их по времени.';
  if(!F.ring) return 'Кар! Последний кадр. Рука над бокалом. Возьми лупу.';
  return 'Кар! Где ты уже видела этого ворона? Перечитай письмо.';
}

function act(id,sel){
  const F=S.f, sc=S.scene;
  if(id==='back'){
    if(sc==='dinner'){go('room',false);setTimeout(()=>msg('Я отпускаю воспоминание. Снова 1975 год, и снова дождь.'),400);}

    else go(PARENT[sc]);
    return true;}
  if(id==='crow'||id==='crowD'||id==='crowO'){sfx.caw();msg(hint(),6500);return true;}
  if(S.ch===2) return act2(id,sel);
  switch(sc+':'+id){
  /* room */
  case 'room:board': go('board'); return true;
  case 'room:clock': go('clock'); return true;
  case 'room:trunk':

    if(F.trunkOpen) go('trunk'); else {sfx.wrong();msg('Мамин сундук. Заперт, а ключ я так и не нашла.');}
    return true;
  case 'room:gramo': case 'room:horn':
    if(sel==='record'){removeItem('record');F.recordPlaced=1;render();msg('«Вальс для Элеоноры». Игла опускается...');music.waltz();
      setTimeout(()=>{F.eyesOpen=1;if(S.scene==='room')render();msg('Мама... открыла глаза?');},6000);
      setTimeout(()=>{sfx.creak();F.portraitOpen=1;if(S.scene==='room')render();msg('Портрет отошёл от стены. За ним что-то есть.');save();},12500);
      return true;}
    if(sel) return false;
    if(F.recordPlaced){music.waltz();msg('Её вальс. Она танцевала под него на кухне.');} else msg('Граммофон. Пластинки нет — мама всегда её прятала.');
    return true;
  case 'room:portrait':
    if(sel==='magnifier'){msg('Мазки мелкие, торопливые. Художник писал её по памяти, уже после.');return true;}
    if(sel) return false;
    msg(F.eyesOpen?'Она смотрит на доску. Будто хочет что-то сказать.':'Мама. Художник написал её с закрытыми глазами — будто она спит.');return true;
  case 'room:niche':
    if(!F.photoTaken){F.photoTaken=1;addItem('photo');render();msg('Фотография того самого вечера. Двадцать два года она пряталась за маминым портретом.');}
    else msg('Пустой тайник. Только пыль и паутина.');
    return true;
  case 'room:magnifier': F.magTaken=1;addItem('magnifier');render();msg('Мамина лупа.');return true;
  case 'room:lamp': if(sel) return false; F.lampOff=!F.lampOff;sfx.click();render();return true;
  case 'room:window': if(sel) return false; msg('Дождь не прекращается с того самого ноября.');return true;
  case 'room:desk': if(sel) return false; msg('В ящиках — мои записи. Двадцать два года вопросов без ответов.');return true;
  case 'room:books': if(sel) return false; msg('Справочник ядов. Подшивка «Вечернего вестника». Мамины статьи.');return true;
  /* clock */
  case 'clock:wH': case 'clock:wM':
    if(sel) return false;
    if(F.clockOpen){msg('Часы снова молчат. Они уже отдали то, что прятали.');return true;}
    if(id==='wH') F.ch=F.ch%12+1; else F.cm=(F.cm+1)%12;

  case 'board:clipping': if(sel) return false; newsOv();return true;
  case 'board:cardA': if(sel) return false; msg('Пикман-холл, 14 ноября 1953 года. Место и время.');return true;
  case 'board:cardB': if(sel) return false; msg('Главный вопрос.');return true;
  case 'board:sixth': msg('«Ты смотришь не туда, Ада». Кто держал фотоаппарат в тот вечер?');return true;

    else msg('Пустой штатив. Кто-то стоял здесь весь вечер — и смотрел.');
    return true;
  case 'dinner:watchHand': if(sel==='camera') return act('doctor',sel); go('watch');return true;
  case 'dinner:bag': go('bag');return true;
  case 'dinner:glass':
    if(sel==='magnifier'&&!F.sediment){F.sediment=1;addItem('sediment');msg('На дне — белёсый осадок. Запах горького миндаля. Это не сердце.');return true;}
    if(sel) return false;
    msg(F.sediment?'Пустой бокал. Всё, что в нём было, теперь у меня.':'Мамин бокал. Опрокинут, вино растеклось по скатерти.');return true;
  case 'dinner:fan':
    if(sel) return false;
    if(!F.noteTaken){F.noteTaken=1;addItem('note');render();msg('В сложенном веере — записка.');} else msg('Веер леди Вейн. Чёрное кружево, слоновая кость.');
    return true;
  case 'dinner:tray':
    if(sel==='camera') return act('butler',sel);
    if(sel) return false;
    if(!F.gloveTaken){F.gloveTaken=1;addItem('glove');render();msg('На подносе лежит одна перчатка. Вторая на руке у Хиггса.');} else msg('Серебряный поднос. Бутылка бордо урожая сорок седьмого.');
    return true;
  case 'dinner:handbag':
    if(sel) return false;
    if(!F.pageTaken){F.pageTaken=1;addItem('page');msg('Мамина сумочка. Блокнота нет, но под подкладкой — вырванная страница.');} else msg('Пустая сумочка. Пудреница, ключи, трамвайный билет.');
    return true;
  case 'dinner:motherChair':
    if(sel==='camera'){msg('Её место пусто. Даже на снимке.');return true;}
    if(sel) return false;
    msg('Мамин стул. Шаль ещё тёплая.');return true;
  case 'dinner:clockD': if(sel) return false; msg('Без двадцати десять. Здесь всегда будет без двадцати десять.');return true;
  case 'dinner:painting': if(sel) return false; msg('Портрет хозяина. Он смотрит на всех нас сверху.');return true;
  case 'dinner:eyes': if(sel) return false; msg('Это я. Мне семь. Я спряталась под столом, когда мама упала.');return true;
  case 'dinner:windowD': if(sel) return false; msg('За окном 1953 год. Тот же самый дождь.');return true;
  case 'dinner:door': if(sel) return false; msg('Дверь на кухню. Оттуда пахнет миндальным пирогом. Или не пирогом.');return true;
  /* bag */
  case 'bag:w0': case 'bag:w1': case 'bag:w2': {
    if(sel) return false;
    const i=+id[1]; F.bag[i]=(F.bag[i]+1)%10; sfx.tick();
    if(F.bag.join('')==='731'){F.bagOpen=1;sfx.unlock();msg('Щёлк. Саквояж открыт.');}
    render(); return true; }
  case 'bag:vial': F.vialTaken=1;addItem('vial');render();msg('Пустой флакон. Аптечная этикетка.');return true;
  case 'bag:bagBody': if(sel) return false; msg(F.bagOpen?'Бинты, стетоскоп, шприцы. Самое интересное я уже забрала.':'Саквояж доктора Грея. Кодовый замок на три цифры.');return true;
  /* watch */
  case 'watch:engr':
    if(sel==='magnifier'){F.engr=1;render();msg('«Д-ру А. Грею — за 731 спасённую жизнь». А сколько он отнял?');return true;}
    if(sel) return false;
    msg(F.engr?'«За 731 спасённую жизнь».':'На крышке гравировка. Слишком мелко — без лупы не разобрать.');return true;
  case 'watch:dial': if(sel) return false; msg('Без двадцати десять. Даже его часы остановились.');return true;
  }
  // people in dinner
  if(sc==='dinner'&&PEOPLE[id]){
    if(sel==='camera'){
      if(F.shot[id]){msg('Этот снимок у меня уже есть.');return true;}
      F.shot[id]=1; sfx.flash(); flashFx(); addItem('ph_'+id); render();
      const done=['doctor','pickman','lady','butler'].every(p=>F.shot[p]);
      msg(`Вспышка. ${PEOPLE[id].name}. ${id==='lady'?'Она':'Он'} медленно поворачивает голову ко мне.`);
      if(done){setTimeout(()=>{removeItem('camera');msg('Плёнка кончилась. Четыре лица — и всё.');},2600);}
      return true;
    }
    if(sel==='magnifier'&&id==='doctor'){go('watch');return true;}
    if(sel) return false;
    talk(id); return true;
  }
  // board slots
  if(sc==='board'&&id.startsWith('slot')){
    const i=+id[4], pid=F.slots[i];
    if(!pid){
      if(sel&&sel.startsWith('ph_')){const p=sel.slice(3);F.slots[i]=p;removeItem(sel);sfx.pin();render();msg(PEOPLE[p].name+'. '+PEOPLE[p].role);return true;}
      if(sel&&EVIDENCE[sel]){sfx.wrong();msg('Сначала лицо. Улику приколю потом, рядом с ним.');S.sel=null;renderInv();return true;}
      if(sel) return false;
      msg('Пустое место. Здесь не хватает лица.');return true;
    }
    if(sel&&EVIDENCE[sel]){
      if(EVIDENCE[sel]===pid){F.linked[pid]=sel;removeItem(sel);sfx.pin();sfx.thread();render();msg(LINKMSG[sel]);checkEnd();}
      else{sfx.wrong();msg(PEOPLE[pid].he?'Не сходится. Это не про него.':'Не сходится. Это не про неё.');S.sel=null;renderInv();}
      return true;
    }
    if(sel==='sediment'){sfx.wrong();msg('Осадок — это о маме, а не о них.');S.sel=null;renderInv();return true;}
    if(sel) return false;
    msg(PEOPLE[pid].name+'. '+(F.linked[pid]?LINKMSG[F.linked[pid]]:PEOPLE[pid].role));return true;
  }
  return false;
}

const TLMSG=[
  'Двадцать один двадцать. Пикман и леди Вейн в коридоре, вдвоём. Пока они целовались, мамин бокал был далеко. Две нити рвутся.',
  'Двадцать один двадцать пять. Доктор курит у камина, а саквояж стоит раскрытым в холле. Флакон мог взять кто угодно. Нить рвётся.',
  'Двадцать один тридцать. Хиггс в буфетной — в одной перчатке. Вторую кто-то у него взял. Нить рвётся.',
  'Двадцать один тридцать пять. Рука в белой перчатке над маминым бокалом. А поверх перчатки — перстень. Слуги перстней не носят.'
];
function act2(id,sel){
  const F=S.f, sc=S.scene;
  switch(sc+':'+id){
  /* office 1975 */
  case 'office:window': if(sel) return false; msg('Дождь. Тот же, что и двадцать два года назад.');return true;
  case 'office:staff': if(sel) return false; msg('«Наши сотрудники». Редактор Холлоуэй, мама... А вместо фотографа — вырезанный квадрат. Подпись: «С. Рук».');return true;
  case 'office:edDoor': if(sel) return false; msg('Кабинет редактора. Заперт. Буквы на стекле облупились.');return true;
  case 'office:clockO': if(sel) return false; msg('Часы встали в десять минут четвёртого. Никто не заметил, когда.');return true;
  case 'office:calO': if(sel) return false; msg('Тридцать первое декабря семьдесят четвёртого. Последний номер «Вестника».');return true;
  case 'office:cabinet': if(sel) return false; go('cabinet');return true;
  case 'office:desk': if(sel) return false; msg('Мамин стол. В ящике — пустые бланки и засохшая чернильница. Всё остальное увезли.');return true;
  case 'office:typer': if(sel) return false; msg('Её «Ундервуд» под чехлом. Я помню, как стучали клавиши.');return true;
  case 'office:boxes': if(sel) return false; msg('«На вывоз». Подшивки, счета, чьи-то перчатки. Двадцать лет газеты — в три коробки.');return true;
  case 'office:lintel':
    if(sel) return false;
    if(F.sawKey&&!F.keyTaken){F.keyTaken=1;addItem('labkey');render();msg('Пыль, паутина — и ключ. Там, где он его оставил двадцать два года назад.');}
    else msg(F.keyTaken?'Пустая притолока.':'Пыльная притолока. Паутина — и больше ничего не видно.');
    return true;
  case 'office:lab':
    if(sel==='labkey'){removeItem('labkey');F.labOpen=1;sfx.unlock();render();msg('Ключ подошёл. Красная лампа над дверью мигнула и зажглась.');setTimeout(()=>go('darkroom'),1100);return true;}
    if(sel) return false;
    if(F.labOpen) go('darkroom'); else {sfx.wrong();msg('Лаборатория. Заперто. «Не входить».');}
    return true;
  /* cabinet */
  case 'cabinet:d10':
    if(sel) return false;
    sfx.drawer(); F.drawer=10;
    if(!F.groupTaken){F.groupTaken=1;addItem('group');render();msg('Ноябрь. Конверт «XI-14 · Пикман-холл» пуст: «Плёнка не сдана. — С. Р.» А под ним — снимок редакции, сделанный днём раньше.',7000);}
    else {render();msg('Ноябрь. Пустой конверт: «Плёнка не сдана».');}
    return true;
  /* memory: office 1953 */
  case 'office53:mother':
    if(sel==='magnifier'){msg('Она держит эту лупу в кармане жакета. Сейчас она лежит в моём.');return true;}
    if(sel) return false;
    if(!F.sawMother){F.sawMother=1;msg('Мама. Живая. Она не видит меня — она видит ту, семилетнюю.',4500);return true;}
    talkTo('mother');return true;
  case 'office53:editor': if(sel) return false; talkTo('editor');return true;
  case 'office53:rook':
    if(sel==='magnifier'){msg('Я наклоняюсь ближе. Свет из-за спины. Лица нет — только тень.');return true;}
    if(sel) return false; talkTo('rook');return true;
  case 'office53:lab':
    if(sel) return false;
    if(!F.sawKey){F.sawKey=1;sfx.unlock();render();msg('Рук запирает лабораторию и кладёт ключ на притолоку. Он думает, что его никто не видит.',5500);}
    else msg('Ключ на притолоке. Двадцать два года он будет лежать там.');
    return true;
  case 'office53:lintel': if(sel) return false; return act2('lab',null);
  case 'office53:letter':
    if(sel) return false;
    F.letterTaken=1;addItem('letter');render();msg('Письмо на бланке приюта святой Агнессы. В углу — герб: ворон с ключом в клюве.');return true;
  case 'office53:typer': if(sel) return false; msg('«ПРИЮТ СВЯТОЙ АГНЕССЫ: КУДА ИСЧЕЗЛИ СОРОК ТЫСЯЧ?» Статья, которая так и не вышла.');return true;
  case 'office53:ada': if(sel) return false; msg('Это я. Рисую «маму и я». Этот рисунок до сих пор лежит в её сундуке.');return true;
  case 'office53:staff': if(sel) return false; msg('Блик лампы на его фотографии. Даже здесь я не вижу его лица.');return true;
  case 'office53:clockO': if(sel) return false; msg('Без четверти семь. Мама обещала, что мы пойдём домой.');return true;
  case 'office53:calO': if(sel) return false; msg('Тринадцатое ноября, пятница. До ужина у Пикмана — один день.');return true;
  case 'office53:edDoor': if(sel) return false; msg('Дверь открыта. Холлоуэй говорит по телефону — тихо, прикрывая трубку.');return true;
  case 'office53:cabinet': if(sel) return false; msg('Архив. Ноябрьский ящик ещё ждёт своих плёнок.');return true;
  case 'office53:window': if(sel) return false; msg('Пятьдесят третий год. Дождь уже идёт.');return true;
  /* darkroom */
  case 'darkroom:switch':
    if(sel) return false;
    F.red=!F.red;sfx.click();render();amb();
    msg(F.red?'Красный свет. Теперь здесь всё одного цвета.':'Белый свет. Резкий, как вспышка.');return true;
  case 'darkroom:bulb': case 'darkroom:safelight': if(sel) return false; return act2('switch',null);
  case 'darkroom:chart': if(sel) return false; F.chart=1; msg('Порядок проявки: проявитель — коричневая крышка, стоп-ванна — зелёная, фиксаж — синяя.',5500);return true;
  case 'darkroom:timer': if(sel) return false; msg('Таймер остановился на восьми минутах. Ровно столько нужно проявителю.');return true;
  case 'darkroom:curtain':
    if(sel) return false;
    if(!F.curtain){F.curtain=1;sfx.creak();render();msg('За шторой — стена. Фотографии, нитки, булавки. Он тоже искал.');setTimeout(()=>go('rookboard'),1400);}
    else go('rookboard');
    return true;
  case 'darkroom:enlarger':
    if(sel==='negative'){
      if(!F.red){sfx.wrong();msg('При белом свете фотобумага почернеет. Нужен красный.');S.sel=null;renderInv();return true;}
      removeItem('negative');F.printing=1;render();sfx.click();msg('Щелчок лампы. Бумага в проявителе... На ней медленно проступают лица.',4000);
      setTimeout(()=>{F.printing=0;F.printed=1;sfx.pin();if(S.scene==='darkroom')render();msg('Четыре отпечатка сохнут на верёвке.');save();},3600);
      return true;}
    if(sel) return false;
    if(!F.filmTaken){F.filmTaken=1;addItem('film');render();msg('В корпусе лампы гремела жестяная банка. «14.XI. Не открывать на свету. — С. Р.»',6000);}
    else msg(F.printed?'Увеличитель остывает. Пахнет нагретой пылью.':'Фотоувеличитель. Лампа ещё работает.');
    return true;
  case 'darkroom:t0': case 'darkroom:t1': case 'darkroom:t2': {
    const i=+id[1], SMELL=['Резкий запах уксуса.','Тяжёлый запах серы.','Почти без запаха. Скользкий, как мыло.'], COL=['Зелёная','Синяя','Коричневая'];
    if(sel==='film'){
      if(!F.red){sfx.wrong();msg('Нет! На белом свету плёнка засветится. Сначала красный свет.');S.sel=null;renderInv();return true;}
      const need=[2,0,1][F.dev];
      if(i!==need){sfx.wrong();F.dev=0;S.sel=null;renderInv();render();msg(SMELL[i]+' Не та кювета — и не тот черёд. Начну сначала.');return true;}
      F.dev++;sfx.slosh();
      if(F.dev===3){removeItem('film');addItem('negative');render();msg('Фиксаж. Теперь свет ей не страшен. Негатив — четыре кадра.');}
      else {render();msg(F.dev===1?'Проявитель. Восемь минут... На плёнке проступают тени.':'Стоп-ванна. Проявка остановлена. Теперь — закрепить.');}
      return true;}
    if(sel) return false;
    msg(F.red?SMELL[i]+' Крышку при красном свете не разглядеть.':COL[i]+' крышка. '+SMELL[i]);return true; }
  /* Rook's wall */
  case 'rookboard:rbMother': if(sel) return false; msg('Мама. Под фотографией его почерком: «Э. — если со мной что-то случится, плёнка в увеличителе».',6000);return true;

  }

  if(sc==='darkroom'&&id.startsWith('hpr')){ const pid=id.slice(1); F.took[pid]=1; addItem(pid); render(); msg('Отпечаток ещё влажный. На стене за ним — часы.'); return true; }
  if(sc==='rookboard'&&id.startsWith('rb_')){ if(sel) return false; const pid=id.slice(3); msg('«'+RBNOTE[pid]+'» — '+PEOPLE[pid].name+'.'); return true; }

        F.tl[i]=sel;removeItem(sel);sfx.pin();if(i<3)setTimeout(()=>sfx.tear(),250);render();msg(TLMSG[i],7000);return true;}
      if(sel) return false;
      msg('Пустое место. Над ним его почерком: '+['21:20','21:25','21:30','21:35'][i]+'.');return true;
    }
    if(i===3&&sel==='magnifier'){ if(!F.ring){F.ring=1;render();msg('На печатке перстня — ворон с ключом в клюве. Где я его уже видела?',6000);} else msg('Ворон с ключом. Я его не забуду.'); return true; }
    if(i===3&&sel==='letter'){
      if(!F.ring){msg('Сначала надо разглядеть перстень.');return true;}
      removeItem('letter');F.crest=1;sfx.pin();sfx.thread();render();msg('Тот же ворон с ключом. Герб приюта святой Агнессы.',6000);checkEnd2();return true; }
    if(sel) return false;
    msg(TLMSG[i]); return true;
  }
  return false;
}
function talkTo(pid){const n=S.f.talk[pid]||0;S.f.talk[pid]=n+1;msg(TALK2[pid][n%TALK2[pid].length]);}
sceneEl.addEventListener('click',e=>{
  if(busy) return;
  const t=e.target.closest('[data-h]'); if(!t) return;
  S.f.touched=1;
  const sel=S.sel, ok=act(t.dataset.h,sel);
  if(!ok&&sel){ S.sel=null; renderInv(); if(!act(t.dataset.h,null)) wrong(); }
  save();
});
function enterMemory(){
  if(MEMORY.has(S.scene)){msg('Я уже здесь.');return;}
  sfx.whoosh(); S.f.visited=1; S.sel=null; renderInv();
  if(S.ch===2){go('office53',true);setTimeout(()=>say(['13 ноября 1953 года. Пятница, без четверти семь.','За день до ужина у Пикмана. Мама ещё здесь.']),1100);return;}
  go('dinner',true);
  setTimeout(()=>say(['14 ноября 1953 года. Без двадцати десять.','Всё застыло — в ту самую минуту.']),1100);
}
function checkEnd2(){
  const F=S.f; if(F.ended||!F.crest) return;
  F.ended=1; save();
  setTimeout(()=>{sfx.caw();msg('Где-то за стеной каркнул ворон.',4000);},2600);
  setTimeout(showEnding2,7000);
}
function showEnding2(){
  openOv(`<div class="ending"><div class="ch">ГЛАВА II · КОНЕЦ</div><h2>Ворон с ключом</h2><p>Четыре кадра — четыре нити рвутся. Пикман и леди Вейн были в коридоре. Доктор курил у камина, бросив саквояж открытым. Хиггс стоял в буфетной в одной перчатке.</p><p>В двадцать один тридцать пять над маминым бокалом — чужая рука в перчатке Хиггса. На пальце перстень: ворон с ключом в клюве. Герб приюта святой Агнессы. Того самого, о котором мама писала свою последнюю статью.</p><p>Сайлас Рук снял это — и не проявил. Утром пятнадцатого ноября он исчез.</p><div class="q">«Теперь ты смотришь туда, Ада»</div><p style="font-size:16px;color:var(--paper-dim)">Глава III. Приют святой Агнессы — скоро.</p><div class="row" style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px"><button class="btn" id="eStay">Посмотреть на стену</button><button class="btn" id="eCh1">Глава I</button><button class="btn red" id="eNew">Начать главу заново</button></div></div>`,e=>{
    if(e.target.id==='eNew'){closeOv();restart();return true;}
    if(e.target.id==='eCh1'){closeOv();switchChapter(1);return true;}
    if(e.target.id==='eStay'){closeOv();if(S.scene!=='rookboard')go('rookboard');return true;}
    return true;
  });
  ovIn.querySelector('.close').remove();
}
function checkEnd(){
  const F=S.f;
  if(F.ended||!F.centerLinked||Object.keys(F.linked).length<4) return;
  F.ended=1; save();
  setTimeout(()=>{lightning(true);},1400);
  setTimeout(()=>{sfx.caw();F.sixth=1;F.sixthAnim=true;if(S.scene==='board')render();msg('Ворон влетел в окно и бросил на доску ещё одну фотографию.',5000);},2600);
  setTimeout(showEnding,8200);
}
function showEnding(){
  openOv(`<div class="ending"><div class="ch">ГЛАВА I · КОНЕЦ</div><h2>Человек без лица</h2><p>Четыре лица на доске. Четыре нити тянутся к маме: флакон из саквояжа, угроза в веере, перчатка на подносе, страница из блокнота. Каждый из них мог.</p><p>Но кто-то в тот вечер стоял за фотоаппаратом. На снимке, который бросил ворон, у этого человека нет лица. На обороте выцветшими чернилами написано:</p><div class="q">«Ты смотришь не туда, Ада»</div><div class="row" style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px"><button class="btn" id="eStay">Посмотреть на доску</button><button class="btn" id="eNew">Начать заново</button><button class="btn red" id="eNext">Глава II →</button></div></div>`,e=>{
    if(e.target.id==='eNew'){closeOv();restart();return true;}
    if(e.target.id==='eNext'){closeOv();switchChapter(2);return true;}
    if(e.target.id==='eStay'){closeOv();if(S.scene!=='board')go('board');return true;}
    return true;
  });
  ovIn.querySelector('.close').remove();
}

/* ---------- fx ---------- */
function flashFx(){const f=$('#flash');f.style.transition='none';f.style.opacity=.95;requestAnimationFrame(()=>{f.style.transition='opacity 1.1s';f.style.opacity=0;});}
function lightning(force){
  const roomish=!MEMORY.has(S.scene)&&!INDOOR.has(S.scene);
  if(!roomish&&!force) return;
  const f=$('#flash'), w=document.getElementById('lightning');
  const seq=[.22,0,.12,0]; let i=0;
  const step=()=>{f.style.transition='none';f.style.opacity=seq[i]*(S.scene==='room'||S.scene==='office'?1:.6);if(w)w.setAttribute('opacity',seq[i]*3.5);i++;if(i<seq.length)setTimeout(step,70+Math.random()*90);};
  step(); setTimeout(()=>sfx.thunder(),600+Math.random()*900);
}
setInterval(()=>{if(started&&!document.hidden&&Math.random()<.045&&!MEMORY.has(S.scene)&&!INDOOR.has(S.scene))lightning();},1000);
// dust motes
const cv=$('#fx'),cx=cv.getContext('2d'); let motes=[];
function sizeFx(){const r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);cv.width=r.width*d;cv.height=r.height*d;}
new ResizeObserver(sizeFx).observe(cv);
for(let i=0;i<46;i++) motes.push({x:Math.random(),y:Math.random(),r:Math.random()*1.6+.4,vx:(Math.random()-.5)*.00012,vy:-Math.random()*.0001-.00002,p:Math.random()*6});
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(t){
  cx.clearRect(0,0,cv.width,cv.height);
  const mem=MEMORY.has(S&&S.scene), redRoom=S&&S.scene==='darkroom'&&S.f.red, W=cv.width,H=cv.height, k=W/1000;
  for(const m of motes){m.x+=m.vx+Math.sin(t/3000+m.p)*.00005;m.y+=m.vy;if(m.y<-.02){m.y=1.02;m.x=Math.random();}if(m.x<0)m.x=1;if(m.x>1)m.x=0;
    const a=(.25+.25*Math.sin(t/900+m.p))*(mem?1.2:.8);cx.fillStyle=mem?`rgba(255,214,150,${a})`:redRoom?`rgba(255,80,60,${a*.7})`:`rgba(255,226,180,${a*.8})`;cx.beginPath();cx.arc(m.x*W,m.y*H,m.r*k*1.3,0,7);cx.fill();}
  if(!reduce) requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- audio ---------- */
const A={ctx:null,on:true};
function ain(){
  if(A.ctx) return;
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  const c=A.ctx=new AC();
  A.master=c.createGain();A.master.gain.value=A.on?.85:0;A.master.connect(c.destination);
  const len=c.sampleRate*2.5, ir=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}
  A.rev=c.createConvolver();A.rev.buffer=ir;A.revG=c.createGain();A.revG.gain.value=.35;A.rev.connect(A.revG);A.revG.connect(A.master);
  const nb=c.createBuffer(1,c.sampleRate*3,c.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;A.noise=nb;
  // rain
  const rs=c.createBufferSource();rs.buffer=nb;rs.loop=true;const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1500;bp.Q.value=.45;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=5200;A.rainG=c.createGain();A.rainG.gain.value=0;rs.connect(bp);bp.connect(lp);lp.connect(A.rainG);A.rainG.connect(A.master);rs.start();
  const rs2=c.createBufferSource();rs2.buffer=nb;rs2.loop=true;rs2.playbackRate.value=.6;const lp2=c.createBiquadFilter();lp2.type='lowpass';lp2.frequency.value=320;const g2=c.createGain();g2.gain.value=.5;rs2.connect(lp2);lp2.connect(g2);g2.connect(A.rainG);rs2.start();
  // memory drone
  A.memG=c.createGain();A.memG.gain.value=0;const mlp=c.createBiquadFilter();mlp.type='lowpass';mlp.frequency.value=420;mlp.connect(A.memG);A.memG.connect(A.master);A.memG.connect(A.rev);
  [[55,'sine',.5],[82.4,'triangle',.18],[110.6,'sine',.12],[164.8,'sine',.05]].forEach(([f,t,g])=>{const o=c.createOscillator();o.type=t;o.frequency.value=f;const gg=c.createGain();gg.gain.value=g;o.connect(gg);gg.connect(mlp);o.start();});
  const lfo=c.createOscillator();lfo.frequency.value=.07;const lg=c.createGain();lg.gain.value=160;lfo.connect(lg);lg.connect(mlp.frequency);lfo.start();
  // crackle
  const cb=c.createBuffer(1,c.sampleRate*4,c.sampleRate),cd=cb.getChannelData(0);for(let i=0;i<cd.length;i++)cd[i]=Math.random()<.0009?(Math.random()*2-1):(Math.random()*2-1)*.012;
  const cs=c.createBufferSource();cs.buffer=cb;cs.loop=true;const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=900;A.crG=c.createGain();A.crG.gain.value=0;cs.connect(hp);hp.connect(A.crG);A.crG.connect(A.master);cs.start();
  amb();
}
function amb(){
  if(!A.ctx) return; const t=A.ctx.currentTime, mem=MEMORY.has(S.scene);
  A.rainG.gain.setTargetAtTime(mem?.045:INDOOR.has(S.scene)?.035:.2,t,.8);A.memG.gain.setTargetAtTime(mem?.11:0,t,1);A.crG.gain.setTargetAtTime(mem?.5:(A.playing?.45:0),t,.5);
}
function env(g,t,a,peak,d){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);}
function osc(type,f,t,dur,peak,dest,a=.005){const c=A.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.connect(g);g.connect(dest||A.master);env(g,t,a,peak,dur);o.start(t);o.stop(t+a+dur+.05);return o;}
function noiseB(t,dur,peak,ftype,f,q=1,dest){const c=A.ctx,s=c.createBufferSource();s.buffer=A.noise;const fl=c.createBiquadFilter();fl.type=ftype;fl.frequency.setValueAtTime(f,t);fl.Q.value=q;const g=c.createGain();s.connect(fl);fl.connect(g);g.connect(dest||A.master);env(g,t,.004,peak,dur);s.start(t,Math.random()*2);s.stop(t+dur+.1);return fl;}
const sfx={
  click(){if(!A.ctx)return;noiseB(A.ctx.currentTime,.03,.25,'highpass',3000);},
  tick(){if(!A.ctx)return;const t=A.ctx.currentTime;noiseB(t,.02,.5,'bandpass',2600,3);osc('square',1800,t,.02,.04);},
  pick(){if(!A.ctx)return;const t=A.ctx.currentTime;osc('sine',880,t,.5,.12,A.rev);osc('sine',1318,t+.09,.7,.1,A.rev);osc('sine',880,t,.25,.08);},
  unlock(){if(!A.ctx)return;const t=A.ctx.currentTime;noiseB(t,.03,.6,'bandpass',2200,4);noiseB(t+.14,.04,.7,'bandpass',1500,4);osc('sine',90,t+.14,.3,.3);},
  wrong(){if(!A.ctx)return;const t=A.ctx.currentTime;osc('sine',98,t,.3,.3);osc('triangle',73,t,.35,.15);},
  pin(){if(!A.ctx)return;const t=A.ctx.currentTime;noiseB(t,.05,.5,'bandpass',900,2);osc('sine',220,t,.08,.15);},
  thread(){if(!A.ctx)return;const t=A.ctx.currentTime;const f=noiseB(t+.05,.5,.18,'bandpass',1800,6);f.frequency.exponentialRampToValueAtTime(4500,t+.5);},
  chime(){if(!A.ctx)return;const t=A.ctx.currentTime;[[196,1],[196*2.76,.4],[196*5.4,.15],[392,.3]].forEach(([f,g])=>osc('sine',f,t,3.4,.22*g,A.rev,.002));[[196,1],[392,.3]].forEach(([f,g])=>osc('sine',f,t,2.5,.2*g,null,.002));},
  flash(){if(!A.ctx)return;const t=A.ctx.currentTime;noiseB(t,.12,.6,'highpass',1200);const o=osc('sine',2400,t,.9,.06);o.frequency.exponentialRampToValueAtTime(7000,t+.8);},
  caw(){if(!A.ctx)return;const c=A.ctx;[0,.38].forEach(d=>{const t=c.currentTime+d,o=c.createOscillator(),bp=c.createBiquadFilter(),g=c.createGain(),tr=c.createOscillator(),tg=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(720,t);o.frequency.exponentialRampToValueAtTime(380,t+.28);bp.type='bandpass';bp.frequency.value=1300;bp.Q.value=2.5;tr.frequency.value=48;tg.gain.value=.5;tr.connect(tg);tg.connect(g.gain);o.connect(bp);bp.connect(g);g.connect(A.master);g.connect(A.rev);env(g,t,.02,.35,.3);o.start(t);tr.start(t);o.stop(t+.4);tr.stop(t+.4);});},
  thunder(){if(!A.ctx)return;const c=A.ctx,t=c.currentTime,s=c.createBufferSource();s.buffer=A.noise;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=180;const g=c.createGain();s.connect(lp);lp.connect(g);g.connect(A.master);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.9,t+.25);g.gain.exponentialRampToValueAtTime(.3,t+1);g.gain.exponentialRampToValueAtTime(.001,t+3.6);s.start(t);s.stop(t+3.8);},
  creak(){if(!A.ctx)return;const c=A.ctx,t=c.currentTime,o=c.createOscillator(),lp=c.createBiquadFilter(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(70,t);o.frequency.linearRampToValueAtTime(150,t+.6);o.frequency.linearRampToValueAtTime(95,t+1.3);lp.type='bandpass';lp.frequency.value=700;lp.Q.value=6;o.connect(lp);lp.connect(g);g.connect(A.master);g.connect(A.rev);env(g,t,.1,.25,1.3);o.start(t);o.stop(t+1.6);},
  tear(){if(!A.ctx)return;const t=A.ctx.currentTime;noiseB(t,.09,.55,'highpass',2600);noiseB(t+.04,.12,.35,'bandpass',700,2);osc('sine',140,t+.03,.12,.12);},
  slosh(){if(!A.ctx)return;const t=A.ctx.currentTime;[0,.35].forEach(d=>{const f=noiseB(t+d,.5,.22,'lowpass',900,1.5);f.frequency.exponentialRampToValueAtTime(220,t+d+.5);});},
  drawer(){if(!A.ctx)return;const t=A.ctx.currentTime;const f=noiseB(t,.32,.3,'bandpass',420,1.4);f.frequency.linearRampToValueAtTime(260,t+.3);osc('sine',62,t+.3,.18,.3);},
  whoosh(){if(!A.ctx)return;const t=A.ctx.currentTime;const f=noiseB(t,1.6,.4,'bandpass',300,2,A.rev);f.frequency.exponentialRampToValueAtTime(3000,t+.8);f.frequency.exponentialRampToValueAtTime(250,t+1.6);osc('sine',110,t,1.8,.12,A.rev,.6);}
};
const music={
  waltz(){
    if(!A.ctx||A.playing) return; A.playing=true; amb();
    const c=A.ctx, bt=.44, t0=c.currentTime+.2, mf=m=>440*Math.pow(2,(m-69)/12);
    const mel=[[76,2],[81,1],[79,1],[77,1],[76,1],[74,2],[71,1],[72,3],[74,2],[77,1],[76,1],[74,1],[72,1],[71,2],[68,1],[69,3],[76,2],[81,1],[83,1],[81,1],[79,1],[77,2],[74,1],[76,3],[72,1],[74,1],[76,1],[77,2],[71,1],[72,1],[71,1],[68,1],[69,3]];
    const CH={Am:[45,[57,60,64]],Dm:[50,[57,62,65]],E:[40,[56,59,64]],G:[43,[55,59,62]],C:[48,[55,60,64]]};
    const prog=['Am','Am','E','Am','Dm','Am','E','Am','Am','G','Dm','C','C','Dm','E','Am'];
    const box=(m,t,v,d=1.8)=>{const f=mf(m);osc('sine',f,t,d,.16*v,null,.003);osc('sine',f*2,t,d*.6,.05*v,null,.003);osc('sine',f*4.02,t,d*.25,.018*v,null,.002);osc('sine',f,t,d,.08*v,A.rev,.003);};
    let t=t0; mel.forEach(([m,b])=>{box(m,t,1);t+=b*bt;});
    prog.forEach((ch,i)=>{const [bass,tri]=CH[ch],tb=t0+i*3*bt;box(bass+12,tb,.7,2.4);tri.forEach(n=>{box(n,tb+bt,.32,.9);box(n,tb+2*bt,.28,.9);});});
    const total=48*bt;
    box(57,t0+total,.6,3);box(69,t0+total,.5,3);
    setTimeout(()=>{A.playing=false;amb();},(total+2)*1000);
  }
};

/* ---------- top bar / menu ---------- */
$('#bHint').onclick=()=>{if(!started)return;sfx.caw();msg(hint(),6500);};
$('#bSound').onclick=()=>{A.on=!A.on;if(A.master)A.master.gain.setTargetAtTime(A.on?.85:0,A.ctx.currentTime,.1);$('#bSound').style.opacity=A.on?1:.45;};
$('#bMenu').onclick=()=>{
  let armed=false;
  const chs=ch2Unlocked()?[1,2].map(n=>`<button class="btn${n===S.ch?' red':''}" id="mCh${n}">${CHAPTERS[n].name}</button>`).join(''):'';
  openOv(`<div class="menu"><h2>Красная нить</h2><button class="btn" id="mCont">Продолжить</button>${chs}<button class="btn" id="mNews">Перечитать газету</button><button class="btn" id="mNew">Начать главу заново</button></div>`,e=>{
    const id=e.target.id;
    if(/^mCh\d$/.test(id)){closeOv();switchChapter(+id[3]);return true;}
    if(id==='mNew'){if(!armed){armed=true;e.target.textContent='Точно? Прогресс сотрётся';return true;}closeOv();restart();return true;}
    if(id==='mNews'){closeOv();setTimeout(newsOv,320);return true;}
    if(id==='mCont'){closeOv();return true;}
    return false;
  });
};
function restart(){S=fresh(S.ch);save();render();renderInv();amb();setTimeout(intro,500);}
function intro(){
  if(S.ch===2){say(['Редакция «Вечернего вестника». Газету закрыли год назад, здание продают.','Здесь мама работала до того ноября. Здесь работал и человек, который снимал тот ужин.','Сторож пустил меня до утра. У меня есть мамина лупа и фотография без лица.']);return;}
  say(['1975 год. Двадцать два года назад, на ужине у мистера Пикмана, умерла моя мать.','Полиция сказала: сердце. Я никогда в это не верила.','Всё, что у меня есть, — газетная вырезка на доске. И эта комната.']);
}
function ch2Unlocked(){const c1=load(1);return S.ch===2||!!(c1&&c1.f.ended)||!!load(2);}
function chapterUI(){const c=CHAPTERS[S.ch];$('#chName').textContent=c.name;$('#tCh').textContent=c.tag;$('#tLead').textContent=c.lead;document.title='Красная нить · '+c.name;}
function switchChapter(n){
  if(busy) return;
  if(n===S.ch){if(!$('#title').classList.contains('gone'))begin(false);return;}
  save(); busy=true;
  const fade=$('#fade'); fade.classList.remove('white'); fade.style.opacity=1;
  setTimeout(()=>{
    const d=load(n); S=d||fresh(n); S.ch=n; S.sel=null;
    chapterUI(); render(); renderInv(); amb(); fade.style.opacity=0; busy=false;
    if(!started) begin(!d); else if(!d) setTimeout(intro,600); else msg(hint().replace('Кар! ',''));
  },700);
}

/* ---------- boot ---------- */
let started=false;
function start(data){
  let last=1; try{last=+localStorage.getItem(LAST_KEY)===2?2:1;}catch(e){}
  const saved=(data&&data.f)?data:load(last);
  S=saved&&saved.f?saved:fresh(last);
  S.ch=S.ch||1; S.sel=null;
  chapterUI();
  if(S.f.recordPlaced&&!S.f.portraitOpen){S.f.eyesOpen=1;S.f.portraitOpen=1;}
  if(S.f.ended&&!S.f.sixth) S.f.sixth=1;
  render(); renderInv();
  const hasProgress=saved&&(S.ch===2?!!saved.f.touched:(saved.f.touched||saved.inv.length||saved.f.clockOpen||saved.f.ch!==3));
  if(hasProgress){$('#bCont').hidden=false;$('#bStart').textContent='Новая игра';$('#bStart').classList.remove('red');$('#bCont').classList.add('red');}
  $('#bStart').onclick=()=>{ain();if(hasProgress){S=fresh(S.ch);render();renderInv();}begin(true);};
  $('#bCont').onclick=()=>{ain();begin(false);};
  window.claude?.hot?.snapshot?.(()=>JSON.parse(JSON.stringify(S)));
  if(data&&data.f){begin(false);}
}
function begin(isNew){started=true;$('#title').classList.add('gone');amb();sfx.thunder();if(isNew)setTimeout(intro,900);else setTimeout(()=>msg(hint().replace('Кар! ','')),900);}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!ov.hidden)closeOv();});
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
