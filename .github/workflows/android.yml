name: Android (RuStore)

on:
  push:
    paths:
      - 'index.html'
      - 'mobile/**'
      - 'steam/fonts/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install and copy the game into the Android project
        working-directory: mobile
        run: |
          npm ci
          npm run sync

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RAW_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RAW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RAW_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Секреты подписи не заданы — собираю только отладочный APK."
            exit 0
          fi
          # секреты часто вставляют с пробелами или переносами строк по краям — убираем их
          trim() { printf '%s' "$1" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.keystore"
          STORE_PW="$(trim "$RAW_STORE_PASSWORD")"; ALIAS="$(trim "$RAW_KEY_ALIAS")"; KEY_PW="$(trim "$RAW_KEY_PASSWORD")"
          echo "::add-mask::$STORE_PW"; echo "::add-mask::$KEY_PW"
          opens() { keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$1" -alias "$ALIAS" > /dev/null 2>&1; }
          # у этого ключа пароль хранилища и пароль ключа одинаковые: если первый секрет заполнен неверно, пробуем второй
          if ! opens "$STORE_PW" && opens "$KEY_PW"; then
            echo "::warning::ANDROID_KEYSTORE_PASSWORD заполнен неверно — использую ANDROID_KEY_PASSWORD. Исправьте секрет, когда будет время."
            STORE_PW="$KEY_PW"
          fi
          if ! opens "$STORE_PW"; then
            # диагностика без раскрытия секретов: только длины и состав
            info() { printf '%s' "$1" | awk -v n="$2" 'BEGIN{l=0}{l++; t=t $0}END{printf "%s: строк %d, символов %d, только буквы и цифры: %s\n", n, l, length(t), (t ~ /^[A-Za-z0-9]+$/ ? "да" : "нет")}'; }
            echo "Ожидается: файл ключа 2658 байт, пароль — 1 строка из 24 букв и цифр, имя ключа — krasnayanit (1 строка, 11 символов)."
            echo "Файл ключа после декодирования: $(stat -c %s "$RUNNER_TEMP/release.keystore") байт, начало sha256: $(sha256sum "$RUNNER_TEMP/release.keystore" | cut -c1-16) (ожидается e8154fc98df52489)"
            info "$STORE_PW" "ANDROID_KEYSTORE_PASSWORD"
            info "$KEY_PW" "ANDROID_KEY_PASSWORD"
            [ "$ALIAS" = "krasnayanit" ] && echo "ANDROID_KEY_ALIAS: верно" || info "$ALIAS" "ANDROID_KEY_ALIAS (неверно)"
            echo "::error::Ключ не открывается: проверьте секреты (см. строки выше)."
            exit 1
          fi
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PASSWORD=$STORE_PW"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASSWORD=$KEY_PW"
          } >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: mobile/android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          if [ -n "$KEYSTORE_FILE" ]; then ./gradlew --no-daemon assembleRelease; fi

      - name: Upload debug APK (для проверки на телефоне)
        uses: actions/upload-artifact@v4
        with:
          name: krasnaya-nit-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk

      - name: Upload release APK (для RuStore)
        if: env.KEYSTORE_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: krasnaya-nit-release-rustore
          path: mobile/android/app/build/outputs/apk/release/*.apk
