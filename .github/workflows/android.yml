name: Android (RuStore)

on:
  push:
    paths:
      - 'index.html'
      - 'mobile/**'
      - 'steam/fonts/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install and copy the game into the Android project
        working-directory: mobile
        run: |
          npm ci
          npm run sync

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RAW_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RAW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RAW_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Секреты подписи не заданы — собираю только отладочный APK."
            exit 0
          fi
          # секреты часто вставляют с пробелами или переносами строк по краям — убираем их
          trim() { printf '%s' "$1" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.keystore"
          STORE_PW="$(trim "$RAW_STORE_PASSWORD")"; ALIAS="$(trim "$RAW_KEY_ALIAS")"; KEY_PW="$(trim "$RAW_KEY_PASSWORD")"
          echo "::add-mask::$STORE_PW"; echo "::add-mask::$KEY_PW"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$STORE_PW" -alias "$ALIAS" > /dev/null 2>&1; then
            echo "::error::Ключ не открывается: проверьте секреты ANDROID_KEYSTORE_PASSWORD и ANDROID_KEY_ALIAS (без лишних слов и кавычек)."
            exit 1
          fi
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PASSWORD=$STORE_PW"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASSWORD=$KEY_PW"
          } >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: mobile/android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          if [ -n "$KEYSTORE_FILE" ]; then ./gradlew --no-daemon assembleRelease; fi

      - name: Upload debug APK (для проверки на телефоне)
        uses: actions/upload-artifact@v4
        with:
          name: krasnaya-nit-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk

      - name: Upload release APK (для RuStore)
        if: env.KEYSTORE_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: krasnaya-nit-release-rustore
          path: mobile/android/app/build/outputs/apk/release/*.apk
